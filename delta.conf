[delta]
	navigate = true
	syntax-theme = Phosphor
	tabs = 4
	minus-style = syntax auto
	hyperlinks = true
	commit-regex = "^-{72}$"
	commit-style = hidden
	commit-decoration-style = yellow ul bold
	commit-meta-style = grey bold
	file-style = blue bold
	file-decoration-style = blue box ol bold
	file-modified-label = M
	file-added-label = A
	file-removed-label = D
	hunk-header-style = line-number syntax
	hunk-header-decoration-style = blue ul dim
	keep-plus-minus-markers = true
	paging = always
